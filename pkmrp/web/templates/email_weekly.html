{# The Monday digest. Inline styles only: mail clients drop <style>. #}
{% set w = wk %}
{% macro num(v, kind) %}{% if kind == 'money' %}{{ v|money }}{% else %}{{ '{:,.0f}'.format(v) }}{% endif %}{% endmacro %}
<!doctype html>
<html><body style="margin:0;padding:0;background:#f5f6f4;font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#14181d;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f6f4;"><tr><td align="center" style="padding:20px 10px;">
<table role="presentation" width="680" cellpadding="0" cellspacing="0" style="max-width:680px;width:100%;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;">
  <tr><td style="padding:22px 26px 6px;">
    <div style="font-size:12px;color:#6b7280;letter-spacing:.04em;text-transform:uppercase;">PK-MRP · week of {{ w.week_of|nice_date(False) }}</div>
    <div style="font-size:22px;font-weight:700;margin-top:4px;">{% if w.sections %}Needs you this week{% else %}Nothing needs you this week{% endif %}</div>
    <div style="font-size:14px;color:#3a4049;margin-top:6px;line-height:1.5;">
      {% for s in w.sections %}<b>{{ s.total }}</b> {{ s.label }}{% if s.new %} <span style="color:#007a61;">({{ s.new }} new)</span>{% endif %}{{ ' · ' if not loop.last }}{% endfor %}
    </div>
    <div style="font-size:12px;color:#6b7280;margin-top:6px;">Most urgent kind first. <b style="color:#007a61;">NEW</b> = not in last Monday's email. Click a part to see why.</div>
  </td></tr>

  {% for s in w.sections %}
  <tr><td style="padding:16px 26px 2px;">
    <div style="font-size:15px;font-weight:700;">{{ s.title }} <span style="font-weight:400;color:#6b7280;font-size:13px;">· {{ s.total }}{% if s.new %} · {{ s.new }} new{% endif %}</span></div>
    <div style="font-size:12px;color:#6b7280;">{{ s.why }}</div>
  </td></tr>
  <tr><td style="padding:2px 26px 4px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:13px;border-collapse:collapse;">
      {% for r in s['items'] %}
      <tr style="border-bottom:1px solid #eef0f2;">
        <td style="padding:7px 8px 7px 0;vertical-align:top;">
          {% if r.new %}<span style="display:inline-block;font-size:10px;font-weight:700;color:#ffffff;background:#007a61;border-radius:4px;padding:1px 5px;margin-right:4px;">NEW</span>{% endif %}
          {% if r.part %}<a href="{{ base_url }}{{ r.link }}" style="font-family:Consolas,monospace;color:#14181d;font-weight:700;">{{ r.part }}</a>{% else %}<a href="{{ base_url }}{{ r.link }}" style="color:#14181d;font-weight:700;">{{ r.vendor or 'Open' }}</a>{% endif %}
          {% if r.description %}<span style="color:#6b7280;"> {{ r.description|lower|capitalize|truncate(40) }}</span>{% endif %}
          <div style="color:#3a4049;margin-top:2px;">{{ r.detail|truncate(190) }}</div>
          {% if r.extra %}<div style="color:#007a61;margin-top:2px;">{{ r.extra }}</div>{% endif %}
        </td>
        <td align="right" style="padding:7px 0;vertical-align:top;white-space:nowrap;">{% if r.money %}<b>{{ r.money|money }}</b><div style="font-size:11px;color:#6b7280;">{{ r.money_label }}</div>{% endif %}</td>
      </tr>
      {% endfor %}
    </table>
    {% if s.total > s['items']|length %}<div style="font-size:13px;padding:6px 0 0;"><a href="{{ base_url }}{{ s.link }}" style="color:#007a61;">All {{ s.total }} →</a></div>{% endif %}
  </td></tr>
  {% endfor %}

  <tr><td style="padding:22px 26px 4px;border-top:1px solid #eef0f2;"><div style="font-size:15px;font-weight:700;">Last week in numbers</div>
    {% if w.trend %}<div style="font-size:12px;color:#6b7280;">{{ w.trend_from|nice_date(False) }} → {{ w.trend_to|nice_date(False) }}</div>{% endif %}</td></tr>
  {% if w.trend %}
  <tr><td style="padding:4px 26px 8px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:13px;border-collapse:collapse;">
      {% for r in w.trend %}
      <tr style="border-bottom:1px solid #eef0f2;">
        <td style="padding:5px 0;color:#3a4049;">{{ r.label }}</td>
        <td align="right" style="padding:5px 0;font-weight:700;">{{ num(r.now, r.kind) }}</td>
        <td align="right" style="padding:5px 0 5px 12px;width:110px;color:{% if r.good is none %}#6b7280{% elif r.good %}#007a61{% else %}#c2410c{% endif %};font-size:12px;">
          {% if not r.delta %}no change{% else %}{{ '▼' if r.delta < 0 else '▲' }} {{ num(r.delta|abs, r.kind) }}{% endif %}</td>
      </tr>
      {% endfor %}
    </table>
  </td></tr>
  {% endif %}
  <tr><td style="padding:2px 26px 8px;font-size:13px;color:#3a4049;line-height:1.6;">
    {% set d = w.done %}
    {% if d.marked %}<b>{{ d.marked }}</b> buy{{ 's' if d.marked != 1 }} marked done{% if d.by_person %} ({% for who, n in d.by_person %}{{ who }} {{ n }}{{ ', ' if not loop.last }}{% endfor %}){% endif %}; MAX confirmed <b style="color:#007a61;">{{ d.confirmed }}</b>.{% else %}No buys were marked done in PK-MRP last week.{% endif %}
    {% if w.impact %}{% set i = w.impact %}<br>Since the ledger started: <b>{{ i.placed_on_time }}</b> placed by the order-by date, <b>{{ i.placed_late }}</b> late, <b style="color:#c2410c;">{{ i.not_placed_overdue }}</b> past due and not placed. Orders protected <b>{{ i.order_value_protected|money }}</b>, at risk <b>{{ i.order_value_at_risk|money }}</b>.{% endif %}
    {% set pr = w.prices or {} %}{% if pr.status == 'ok' and pr.change_12m is not none %}<br>The same parts cost <b>{{ '%+.1f'|format(pr.change_12m) }}%</b> vs a year ago.{% endif %}
    {% if w.audit and w.audit.pos_30d %}<br>{{ w.audit.pos_30d }} PO lines placed in 30 days{% if w.audit.extra_pos_30d %}, {{ w.audit.extra_pos_30d }} of them repeats{% endif %}.{% endif %}
    {% if w.vendor_on_time %}<br>Vendor on-time (first receipt by the date first asked): {% for q in w.vendor_on_time %}{{ q.quarter }} <b>{{ q.on_time_pct|round|int }}%</b>{{ ' · ' if not loop.last }}{% endfor %}.{% endif %}
    {% if w.fix_max %}<br>Fix in MAX: {{ w.fix_max.so_scheduled }} order lines, {{ w.fix_max.ms_entries }} forecast entries and {{ w.fix_max.work_orders }} work orders still name an ECN-obsoleted part.{% elif w.ecn_status == 'no_access' %}<br>Fix in MAX is waiting on read access to the ECN database.{% endif %}
  </td></tr>

  <tr><td style="padding:12px 26px 22px;border-top:1px solid #eef0f2;font-size:13px;">
    <a href="{{ base_url }}/" style="color:#007a61;font-weight:700;text-decoration:none;">Open PK-MRP</a>
    &nbsp;·&nbsp;<a href="{{ base_url }}/analytics" style="color:#007a61;text-decoration:none;">Analytics</a>
    &nbsp;·&nbsp;<a href="{{ base_url }}/eol" style="color:#007a61;text-decoration:none;">EOL watch</a>
    &nbsp;·&nbsp;<a href="{{ base_url }}/weekly" style="color:#007a61;text-decoration:none;">Who gets this</a>
    <div style="font-size:11px;color:#9ca3af;margin-top:8px;">From PK-MRP's plan of {{ (w.generated_at or '')[:16]|replace('T', ' ') }}. Shadow mode: PK-MRP's numbers and what MAX shows, not targets. One email a week, Mondays.</div>
  </td></tr>
</table>
</td></tr></table>
</body></html>
